# Continuous integration for crm-lead.
# Every push and pull request runs the same checks a developer runs locally, on a clean machine.
# No secrets are used: the database credentials below are throwaway values for this CI run only.

name: CI

on:
  push:
  pull_request:

# One run per branch/PR; a new push cancels the older run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A temporary PostgreSQL 16 for the database tests (real PostgreSQL, as the project requires).
    # pgvector image here only for CI's throwaway cluster: a fresh database has no existing
    # collation-sensitive indexes, so the Alpine/glibc concern from ADR 0010 does not apply.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: postgres
      # Used by infrastructure/postgres/init/01-create-roles-and-databases.sh
      POSTGRES_USER: postgres
      CRM_DB_OWNER_USER: crm_owner
      CRM_DB_OWNER_PASSWORD: ci-owner-password
      CRM_DB_APP_USER: crm_app
      CRM_DB_APP_PASSWORD: ci-app-password

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create the database roles and databases
        # The same script the Docker container runs on first start: owner role + app role,
        # crm and crm_test databases. Keeping it identical means CI tests the real setup.
        run: sh infrastructure/postgres/init/01-create-roles-and-databases.sh

      - name: Let the owner role bypass row-level security (test setup only)
        # Docker runs 04-owner-bypassrls.sh on first start; CI has to run it too. The database
        # tests build their data as crm_owner (ADR 0009), which must bypass RLS. crm_app, the
        # role the API uses, never gets it. Without this step nearly every database test failed
        # in CI with "new row violates row-level security policy".
        run: sh infrastructure/postgres/init/04-owner-bypassrls.sh

      - name: Enable pgvector in the test database
        # The service container is not the local Docker image, so its init scripts do not run.
        # A fresh CI database has no indexes yet, so the extension can be created now.
        run: psql -U "$POSTGRES_USER" -d crm_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install the backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Format check (ruff)
        working-directory: backend
        run: ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app tests

      - name: Module boundaries (import-linter)
        working-directory: backend
        run: lint-imports

      - name: Tests (pytest, real PostgreSQL)
        working-directory: backend
        env:
          # The app role is what the API uses; the owner role is what Alembic uses.
          CRM_TEST_DATABASE_URL: postgresql+psycopg://crm_app:ci-app-password@127.0.0.1:5432/crm_test
          CRM_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://crm_owner:ci-owner-password@127.0.0.1:5432/crm_test
          # The agent evaluation test (BP-10) writes its scorecard here when this is set.
          AGENT_EVAL_OUT_DIR: ${{ runner.temp }}/agent-evals
        run: pytest -q

      - name: Agent evaluation scorecard (job summary)
        # Runs even when a test failed: the table says which case broke and why.
        if: always()
        run: |
          if [ -f "$AGENT_EVAL_OUT_DIR/summary.md" ]; then
            cat "$AGENT_EVAL_OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No agent evaluation summary was written." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AGENT_EVAL_OUT_DIR: ${{ runner.temp }}/agent-evals

      - name: Agent evaluation scorecard (file)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-scorecard
          path: ${{ runner.temp }}/agent-evals/scorecard.json
          if-no-files-found: ignore

  mcp-server:
    # The CRM MCP server for IDEs and agents (ADR 0015). Unit tests use a fake Keycloak and API;
    # the live tests need the local stack and are skipped here.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies (exact versions from uv.lock)
        run: |
          python -m pip install uv
          uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check (mypy, strict)
        run: uv run mypy src tests

      - name: Tests (pytest, no live services)
        run: uv run pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Component tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
