# REHEARSAL ONLY - NEVER use this file on a real server (ADR 0021, step OH3).
#
# It lets the real stack run on a PC, so the proxy, the HTTPS names, the sign-in service and the API
# can be tried TOGETHER without renting anything:
#
#     docker compose --env-file <rehearsal .env> -f docker-compose.yml \
#         -f rehearsal/docker-compose.rehearsal.yml up -d --build
#     ENV_FILE=<rehearsal .env> rehearsal/smoke.sh
#
# What it changes, and nothing else:
#   * the proxy publishes on this PC only (127.0.0.1) and on 8080 / 8443, not on 80 / 443;
#   * the proxy takes its certificates from a throwaway authority of its own (rehearsal/tls.caddy)
#     instead of Let's Encrypt, because a PC has no public name;
#   * the API and the worker are told to trust that authority, so they can reach the sign-in service
#     over HTTPS exactly as they do on the server. They still run as the unprivileged account: a tiny
#     helper copies only the authority's PUBLIC certificate into a volume they can read.
#   * so that the authority exists before the API starts, the proxy starts first (it only waits for
#     the sign-in service); production keeps the API first.

services:
  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./rehearsal/tls.caddy:/etc/caddy/tls.caddy:ro
    depends_on: !override
      - keycloak

  rehearsal-ca:
    # Waits until the proxy has made its authority, then copies the public certificate (never the key)
    # to a place the API's user may read, and exits.
    image: caddy:2.10.2-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until [ -s /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done;
        cp /data/caddy/pki/authorities/local/root.crt /ca/root.crt && chmod 0644 /ca/root.crt
    volumes:
      - caddy_data:/data:ro
      - rehearsal_ca:/ca
    depends_on:
      - caddy
    mem_limit: 64m
    networks:
      - crm

  api:
    environment:
      # The variable lets the smoke test take the trust away on purpose, to prove it can tell.
      SSL_CERT_FILE: ${REHEARSAL_SSL_CERT_FILE:-/rehearsal-ca/root.crt}
    volumes:
      - rehearsal_ca:/rehearsal-ca:ro
    depends_on:
      rehearsal-ca:
        condition: service_completed_successfully

  worker:
    environment:
      SSL_CERT_FILE: ${REHEARSAL_SSL_CERT_FILE:-/rehearsal-ca/root.crt}
    volumes:
      - rehearsal_ca:/rehearsal-ca:ro
    depends_on:
      rehearsal-ca:
        condition: service_completed_successfully

volumes:
  rehearsal_ca:
