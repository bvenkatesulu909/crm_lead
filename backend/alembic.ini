# Alembic configuration. Run commands from the backend folder, e.g.:
#   alembic upgrade head
#   alembic revision --autogenerate -m "add opportunities table"
#
# The database URL is NOT stored here. alembic/env.py reads CRM_MIGRATION_DATABASE_URL
# (the schema-owner role) from the environment / backend/.env.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Migration files are named like 20261018_0001_initial_schema.py so they sort by date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
