[project]
name = "crm-mcp"
version = "0.2.0"
description = "Local, read-only MCP server for crm-lead (ADR 0010)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
]

[project.scripts]
crm-mcp = "crm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["live: needs the local Keycloak + API running (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
