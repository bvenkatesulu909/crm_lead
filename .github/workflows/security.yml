# CI security gate (BP-20, docs/ci-security-gate.md).
# Fails when a package we use has a published security advisory (Python: any, unless listed with a
# reason and an expiry date in security/audit-exceptions.toml; web: high or critical in what users
# run), or when a secret appears anywhere in the git history. No secrets are used by this job.

name: Security

on:
  push:
  pull_request:
  # New advisories appear without any code change: check main every Monday at 03:00 UTC
  # (08:30 in India). A red run shows on GitHub and GitHub e-mails the repository owner.
  schedule:
    - cron: "0 3 * * 1"
  # The same check by hand: Actions -> Security -> Run workflow.
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code (whole history, for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the audit tools (pinned)
        run: python -m pip install pip-audit==2.9.0 uv==0.13.1

      - name: Audit the Python packages (API, worker, dev tools, MCP server)
        run: |
          mkdir -p audit
          # pip-audit exits 1 when it FINDS something; the judge below decides. Any other failure
          # (no report written) stops the job.
          pip-audit --progress-spinner off -r backend/requirements.txt -f json -o audit/api.json || true
          pip-audit --progress-spinner off -r backend/requirements-dev.txt -f json -o audit/dev.json || true
          uv export --directory mcp-server --frozen --no-hashes --no-emit-project > audit/mcp-requirements.txt
          pip-audit --progress-spinner off --no-deps -r audit/mcp-requirements.txt -f json -o audit/mcp.json || true
          for report in api dev mcp; do test -s "audit/$report.json" || { echo "pip-audit wrote no $report report"; exit 1; }; done

      - name: Judge the advisories against the dated exceptions
        working-directory: backend
        run: python -m scripts.check_audit ../audit/api.json ../audit/dev.json ../audit/mcp.json --exceptions ../security/audit-exceptions.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit the web packages users run (high and critical fail)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Report every web finding, development tools included (does not fail)
        if: always()
        working-directory: frontend
        run: |
          {
            echo "### npm audit (all packages, including development tools)"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the whole git history for secrets (gitleaks, pinned image)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --no-banner --exit-code 1
          --gitleaks-ignore-path /repo/.gitleaksignore
